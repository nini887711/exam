<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFlow Solutions - ციფრული ინოვაციების პლატფორმა</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="header-container">
            <div class="logo">Tech<span>Flow</span></div>
            <nav class="nav-links">
                <a href="#hero">მთავარი</a>
                <a href="#calculator">კალკულატორი</a>
                <a href="#features">სერვისები</a>
                <a href="#contact">კონტაქტი</a>
            </nav>
            <button class="btn btn-secondary">შესვლა</button>
        </div>
    </header>

    <section id="hero" class="hero-section">
        <div class="hero-wrapper">
            <div class="hero-content">
                <span class="badge">ინოვაცია 2026</span>
                <h1>მართე შენი ციფრული ბიზნესი მარტივად და ეფექტურად</h1>
                <p>TechFlow გთავაზობთ თანამედროვე ღრუბლოვან გადაწყვეტილებებს, AI ანალიტიკასა და უსაფრთხოების მაღალ სტანდარტებს ერთ პლატფორმაზე.</p>
                <div class="hero-actions">
                    <a href="#calculator" class="btn btn-primary">დაიწყე ახლავე</a>
                    <a href="#features" class="btn btn-outline">გაიგე მეტი</a>
                </div>
            </div>
            
            <div class="hero-image-container">
                <img src="images/hero-banner.webp" id="main-hero-img" class="hero-img" alt="TechFlow Banner" loading="lazy">
            </div>
        </div>
    </section>

    <div></div>

    <script src="script.js"></script>
</body>
</html>
